name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\ScreenQR.Tests\ScreenQR.Tests.csproj

      - name: Build
        run: dotnet build .\ScreenQR.Tests\ScreenQR.Tests.csproj -c Release --no-restore

      - name: Run regression checks
        run: dotnet run --project .\ScreenQR.Tests\ScreenQR.Tests.csproj -c Release --no-build
